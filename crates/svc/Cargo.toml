[package]
name = "svc"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Host Windows služby (SPEC kap. 2.2). Binárka syswatch.exe:
#   --service → běh pod SCM (produkce)
#   --console → obyčejný elevovaný proces (vývoj)
[[bin]]
name = "syswatch"
path = "src/main.rs"

[dependencies]
core-types = { workspace = true }
win-sys = { workspace = true }
store = { workspace = true }
ipc = { workspace = true }
collector-proc = { workspace = true }
collector-etw = { workspace = true }
collector-crash = { workspace = true }
collector-hw = { workspace = true }
collector-inv = { workspace = true }
collector-net = { workspace = true }
collector-sec = { workspace = true }
collector-users = { workspace = true }
collector-drv = { workspace = true }
collector-boot = { workspace = true }
fs-index = { workspace = true }
validate = { workspace = true }
actor-toggle = { workspace = true }
actor-proc = { workspace = true }
actor-file = { workspace = true }
actor-app = { workspace = true }
windows-service = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
notify = { workspace = true }
ctrlc = { workspace = true }
thiserror = { workspace = true }

# Zabudování ikony do PE resource (build.rs).
[build-dependencies]
winresource = "0.1"
