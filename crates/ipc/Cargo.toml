[package]
name = "ipc"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Protokol named pipe: postcard, délkově prefixované rámce (SPEC kap. 10).
[dependencies]
core-types = { workspace = true }
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_IO",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

# Brány (examples) sahají na validační vrstvu — čtení registru —
# a memcheck si navíc bere syrový snapshot procesů, aby měl s čím
# porovnat čísla, která hlásí služba.
[dev-dependencies]
serde_json = "1"
validate = { workspace = true }
win-sys = { workspace = true }
