[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Tauri v2 + SvelteKit (SPEC kap. 2.2). UI běží jako běžný uživatel,
# nikdy jako admin — je čistě zobrazovací (SPEC kap. 2.1).
[[bin]]
name = "syswatch-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-types = { workspace = true }
win-sys = { workspace = true }
ipc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
# Hlídač jediné instance: druhé spuštění nesmí vyrobit další proces
# s další ikonou v traye — jen ukáže okno té běžící.
tauri-plugin-single-instance = "2"

# Win32 jen pro to, co je vázané na RELACI uživatele a služba v session 0
# to nevidí: spuštění odinstalátoru (src/uninstall.rs) a připojené
# obrazovky (src/display.rs). UI zůstává zobrazovací — o tom, *zda* se
# smí něco změnit, rozhoduje validační vrstva ve službě.
[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Com",
]
