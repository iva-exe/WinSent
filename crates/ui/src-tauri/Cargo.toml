[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Tauri v2 + SvelteKit (SPEC kap. 2.2). UI běží jako běžný uživatel,
# nikdy jako admin — je čistě zobrazovací (SPEC kap. 2.1).
[[bin]]
name = "syswatch-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-types = { workspace = true }
ipc = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }

# Jen pro spuštění odinstalátoru v relaci uživatele (src/uninstall.rs).
# UI zůstává zobrazovací — o tom, *zda* se smí odinstalovat, rozhoduje
# validační vrstva ve službě, UI dostane hotový příkaz.
[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
