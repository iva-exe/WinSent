[package]
name = "ui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Tauri v2 + SvelteKit (SPEC kap. 2.2). UI běží jako běžný uživatel,
# nikdy jako admin — je čistě zobrazovací (SPEC kap. 2.1).
[[bin]]
name = "syswatch-ui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
core-types = { workspace = true }
ipc = { workspace = true }
serde = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
