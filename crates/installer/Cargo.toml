[package]
name = "installer"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Jediný soubor, který se posílá testerovi. Stáhne aktuální binárky
# z repozitáře, nainstaluje je jako aplikaci a zaregistruje službu.
# Druhé spuštění = aktualizace na to, co je v repu teď.
[[bin]]
name = "WinsentSetup"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
windows-service = { workspace = true }

# Stahování jde přes WinHttp (součást Windows) — žádná TLS knihovna
# navíc, žádné vlastní úložiště certifikátů, menší binárka.
[dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_System_Com",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_System_Threading",
]
